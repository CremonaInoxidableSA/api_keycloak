services:
  mysql-db-api-keycloak:
    image: mysql:8.0
    container_name: mysql-db-api-keycloak
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TIMEZONE:-America/Argentina/Buenos_Aires}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intranet_api_keycloak_network
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build: .
    container_name: intranet_api_keycloak
    restart: unless-stopped
    expose:
      - "${API_PORT:-8000}"
    env_file:
      - .env
    volumes:
      - ${AWS_CREDENTIALS_PATH:-/home/ec2-user/.aws}:/root/.aws:ro
    networks:
      - intranet_api_keycloak_network
    depends_on:
      mysql-db-api-keycloak:
        condition: service_healthy

networks:
  intranet_api_keycloak_network:
    external: true

volumes:
  mysql_data: